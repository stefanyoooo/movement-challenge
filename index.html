<style>
  :root{
    --bg:#efe6d8; --card:#fffdf9; --ink:#241c16; --muted:#74685c; --line:rgba(72,46,24,.12);
    --brand:#c24d2c; --brand-deep:#8c3118; --brand-soft:#f8e6db; --green:#1c7a4d; --green-soft:#e6f5ec;
    --gold:#c89212; --gold-soft:#fff6dc; --silver:#8b93a3; --bronze:#b56a32;
    --radius:22px; --shadow:0 16px 40px rgba(72,40,16,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:Outfit,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif;
    background:
      radial-gradient(820px 380px at -8% -10%, #ffd7c2 0%, transparent 62%),
      radial-gradient(680px 360px at 112% -6%, #f6d48a 0%, transparent 58%),
      linear-gradient(180deg,#f7f1e7 0%, #efe6d8 42%, #f6f1e8 100%);
    color:var(--ink);line-height:1.55;-webkit-text-size-adjust:100%;overflow-wrap:anywhere;
    min-height:100vh;
  }
  .wrap{max-width:840px;margin:0 auto;padding:22px 16px 64px}
  header{
    display:flex;flex-direction:column;align-items:flex-start;
    padding:16px 20px 20px;border-radius:28px;
    background:linear-gradient(160deg,rgba(255,253,249,.92),rgba(255,246,236,.72));
    border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);
  }
  .lang{align-self:flex-end;display:flex;background:rgba(255,253,249,.9);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 1px 0 rgba(255,255,255,.8);margin-bottom:2px}
  .lang button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;color:var(--muted);cursor:pointer}
  .lang button.on{background:var(--ink);color:#fff8ef}
  h1{
    font-family:Fraunces,"Iowan Old Style",Palatino,"Songti TC","PMingLiU","PingFang HK",serif;
    font-size:clamp(32px,6vw,46px);font-weight:560;letter-spacing:-.03em;line-height:1.12;
    margin:14px 0 10px;
  }
  h1 .emoji{margin-right:6px}
  .pill{display:inline-block;background:var(--green-soft);color:var(--green);font-weight:650;font-size:12.5px;letter-spacing:.02em;padding:5px 12px;border-radius:999px}
  .note{color:var(--muted);font-size:14px;margin:0;max-width:38em}
  section{
    background:var(--card);border:1px solid rgba(255,255,255,.7);border-radius:var(--radius);
    padding:20px 18px;margin-top:16px;box-shadow:var(--shadow);
  }
  h2{
    font-family:Fraunces,"Iowan Old Style",Palatino,"Songti TC","PingFang HK",serif;
    font-size:23px;font-weight:560;letter-spacing:-.02em;margin:0 0 14px;line-height:1.25;
  }
  h3{font-size:15px;margin:0 0 8px}
  ul,ol{margin:0;padding-left:0;list-style:none}
  li{margin:0}
  .muted{color:var(--muted)}
  .cards{display:grid;gap:12px}
  .pcard{
    position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;
    padding:14px 14px 12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;
    background:#fff;
  }
  .pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
  .r1{background:linear-gradient(180deg,#fff8e8,#fff)}
  .r1::before{background:linear-gradient(#f3d36a,#b8860b)}
  .r2{background:linear-gradient(180deg,#f6f7fa,#fff)}
  .r2::before{background:linear-gradient(#d5dbe6,#8b93a3)}
  .r3{background:linear-gradient(180deg,#fff4eb,#fff)}
  .r3::before{background:linear-gradient(#e2b089,#b56a32)}
  .rank{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:var(--brand);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
  .r1 .rank{background:linear-gradient(180deg,#f0c94a,#c89212);color:#3d2c00}
  .r2 .rank{background:linear-gradient(180deg,#d7dee8,#8e97a8);color:#1d2430}
  .r3 .rank{background:linear-gradient(180deg,#e0a36a,#b56a32);color:#3b220c}
  .pname{font-weight:700;font-size:18px;letter-spacing:-.01em}
  .ptotal{text-align:right}
  .ptotal b{font-family:Fraunces,"Iowan Old Style",Palatino,serif;font-size:30px;font-weight:560;display:block;line-height:1;letter-spacing:-.03em}
  .ptotal small{color:var(--muted);font-size:11px;letter-spacing:.04em}
  .bar{grid-column:1/-1;height:9px;background:#f3e7da;border-radius:99px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#e7a15a,var(--brand));border-radius:99px}
  .stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .stat{background:rgba(255,252,247,.85);border:1px solid rgba(72,46,24,.06);border-radius:12px;padding:7px 4px;text-align:center}
  .stat span{display:block;font-size:10.5px;color:var(--muted);line-height:1.25}
  .stat b{font-size:14px}
  table{width:100%;border-collapse:collapse;display:none;font-size:14px}
  th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:center}
  th{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
  td.n{text-align:left;font-weight:700;font-size:16px}
  td.t{font-family:Fraunces,"Iowan Old Style",Palatino,serif;font-weight:560;font-size:22px;letter-spacing:-.03em}
  tr:last-child td{border-bottom:0}
  td.rankcell{width:52px}
  .mini{display:block;height:5px;margin-top:5px;background:#f3e7da;border-radius:99px;overflow:hidden}
  .mini i{display:block;height:100%;background:linear-gradient(90deg,#e7a15a,var(--brand));border-radius:99px}
  @media (min-width:980px){ table.lb{display:table} .cards.lb{display:none} section{padding:22px 22px} }
  #past-results > summary{cursor:pointer;border-radius:8px}
  #past-results > summary h2{display:inline;margin:0}
  #past-results > summary:focus-visible{outline:2px solid var(--brand);outline-offset:6px}
  #past-results[open] > summary{margin-bottom:14px}
  .prev{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:8px;background:#fff}
  .prev .row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
  .score-list > li{padding:10px 0;border-bottom:1px solid var(--line)}
  .score-list > li:last-child{border-bottom:0;padding-bottom:0}
  .ref{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 2px;padding:0;list-style:none}
  .ref li{margin:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;font-size:13px}
  .ref li b{display:block;font-size:15px;color:var(--brand-deep);margin-top:2px}
  .sample{background:linear-gradient(180deg,#fffaf0,#fffdf8);border:1px solid #efd48a;box-shadow:none}
  .tag{display:inline-block;background:#f6d56b;color:#3b2b00;font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;margin-bottom:10px}
  .sample p{margin:0 0 8px}
  .sample .muted{margin:0;font-size:13px}
  #rules-list{counter-reset:rule}
  #rules-list li{counter-increment:rule;position:relative;padding:11px 0 11px 42px;border-bottom:1px solid var(--line)}
  #rules-list li:last-child{border-bottom:0;padding-bottom:0}
  #rules-list li::before{
    content:counter(rule);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;
    background:var(--brand-soft);color:var(--brand-deep);font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  #goals-list{display:block}
  .gweek{width:100%;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
  .gweek:first-child{margin-top:0;padding-top:0;border-top:0}
  .gweek > h3{font-family:Fraunces,"Iowan Old Style",Palatino,"Songti TC","PingFang HK",serif;font-size:18px;font-weight:560;margin:0 0 10px}
  .gweek.cur > h3{color:var(--brand-deep)}
  .goals{display:grid;gap:10px}
  @media (min-width:720px){ .goals{grid-template-columns:repeat(3,1fr)} .ref{grid-template-columns:repeat(4,1fr)} section{padding:22px 22px} }
  .gcard{border:1px solid var(--line);border-radius:16px;padding:14px 14px 8px;background:#fff}
  .gcard h3{margin-bottom:2px}
  .slot{display:grid;grid-template-columns:auto minmax(0,1fr) 22px;align-items:center;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px dashed var(--line)}
  .glabel{font-weight:650;white-space:nowrap}
  .gtext{min-width:0;overflow-wrap:normal;word-break:normal}
  .gtext.tbc{white-space:nowrap}
  .tick{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid rgba(72,46,24,.18);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;color:transparent}
  .slot.done .tick{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
  .tbc{color:var(--muted);font-style:italic}
  .tl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;list-style:none;padding:0}
  @media (min-width:720px){ .tl{grid-template-columns:repeat(4,1fr)} }
  .tl li{margin:0;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;background:#fff}
  .tl li b{display:block;font-family:Fraunces,"Iowan Old Style",Palatino,serif;font-size:16px;font-weight:560}
  .tl li.cur{border-color:transparent;background:var(--ink);color:#fff8ef}
  .tl li.cur .tbc{color:#fff8ef}
  footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lang" role="group" aria-label="Language">
      <button id="btn-zh" class="on" onclick="setLang('zh')">繁中</button>
      <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <span class="pill" data-i="pill"></span>
    <h1><span class="emoji">🏃</span><span data-i="title"></span></h1>
    <p class="note" data-i="note"></p>
  </header>

  <section id="leaderboard">
    <h2 id="lb-head"></h2>
    <div class="cards lb" id="lb-cards"></div>
    <table class="lb" id="lb-table"></table>
  </section>

  <section id="previous">
    <details id="past-results">
      <summary><h2 data-i="prevTitle"></h2></summary>
      <div id="prev-list"></div>
    </details>
  </section>

  <section id="scoring">
    <h2 data-i="scoreTitle"></h2>
    <ul class="score-list">
      <li data-i="score1"></li>
      <li><span data-i="refIntro"></span>
        <ul class="ref" id="ref-list"></ul>
      </li>
      <li data-i="score3"></li>
      <li data-i="score4"></li>
    </ul>
  </section>

  <section class="sample" id="example">
    <span class="tag" data-i="sampleTag"></span>
    <h2 data-i="sampleTitle"></h2>
    <p data-i="sampleBody"></p>
    <p class="muted" data-i="sampleNote"></p>
  </section>

  <section id="rules">
    <h2 data-i="rulesTitle"></h2>
    <ol id="rules-list"></ol>
  </section>

  <section id="goals">
    <h2 data-i="goalsTitle"></h2>
    <div class="goals" id="goals-list"></div>
  </section>

  <section id="timeline">
    <h2 data-i="tlTitle"></h2>
    <ul class="tl" id="tl-list"></ul>
  </section>

  <footer data-i="footer"></footer>
</div>

      "No heart-rate checks, no zones, no minimum session length, no restrictions on type of exercise.",
      "Nothing extra beyond 120 minutes (exercise points cap at 80).",
      "Personal goal points: 10 for Goal 1 + 10 for Goal 2, only counted when your report says you've hit it, each at most once per week.",
      "The first two weeks are a trial period."
    ],
    goalsTitle: "Personal goals",
    goalWeek: (week) => `Week ${week.week} (${week.dates.en})`,
    goal1: "Goal 1", goal2: "Goal 2",
    done: "Done", notDone: "Not done",
    tbc: "TBC",
    tlTitle: "Timeline (W1–W12)",
    trial: "trial", datesTbc: "Dates TBC",
    footer: "A friendly game between friends · not a medical or fitness assessment 💪"
  }
};

let LANG = "zh";
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const t = T[LANG], w = DATA.currentWeek;
  document.documentElement.lang = LANG === "zh" ? "zh-Hant" : "en";
  document.title = LANG === "zh" ? "運動挑戰排行榜 · Movement Challenge Leaderboard" : "Movement Challenge Leaderboard";
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t[el.dataset.i]; });
  document.getElementById("btn-zh").classList.toggle("on", LANG === "zh");
  document.getElementById("btn-en").classList.toggle("on", LANG === "en");

  document.getElementById("lb-head").textContent = t.lbHead(w);
  document.getElementById("lb-cards").innerHTML = w.rows.map(r => `
    <div class="pcard r${r.rank}">
      <div class="rank">${esc(r.rank)}</div>
      <div class="pname">${esc(r.name)}</div>
      <div class="ptotal"><small>${t.totalLbl}</small><b>${esc(r.total)}</b></div>
      <div class="bar"><i style="width:${Math.min(100, parseFloat(r.progress)||0)}%"></i></div>
      <div class="stats">
        <div class="stat"><span>${t.short[0]}</span><b>${esc(r.minutes)}</b></div>
        <div class="stat"><span>${t.short[1]}</span><b>${esc(r.progress)}</b></div>
        <div class="stat"><span>${t.short[2]}</span><b>${esc(r.exercise)}</b></div>
        <div class="stat"><span>${t.short[3]}</span><b>${esc(r.goals)}</b></div>
      </div>
    </div>`).join("");
  document.getElementById("lb-table").innerHTML =
    `<thead><tr>${t.cols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>` +
    w.rows.map(r => `<tr class="r${r.rank}"><td class="rankcell"><span class="rank">${esc(r.rank)}</span></td><td class="n">${esc(r.name)}</td><td>${esc(r.minutes)}</td><td>${esc(r.progress)}<span class="mini"><i style="width:${Math.min(100, parseFloat(r.progress)||0)}%"></i></span></td><td>${esc(r.exercise)}</td><td>${esc(r.goals)}</td><td class="t">${esc(r.total)}</td></tr>`).join("") +
    `</tbody>`;

  document.getElementById("prev-list").innerHTML = DATA.previousWeeks.map(pw => `
    <div class="prev"><h3>${esc(t.prevWeek(pw))}</h3>
      ${pw.rows.map(r => `<div class="row"><b>${esc(r.name)}</b><span>${t.prevRow(r)}</span></div>`).join("")}
    </div>`).join("");

  document.getElementById("ref-list").innerHTML = t.refs.map(([a,b]) => `<li>${a}<b>→ ${b}</b></li>`).join("");
  document.getElementById("rules-list").innerHTML = t.rules.map(r => `<li>${r}</li>`).join("");
  const goalText = (v) => {
    if (v == null || v === "") return "";
    if (typeof v === "string") return v;
    return v[LANG] || v.zh || v.en || "";
  };
  const goalSlot = (label, value, done) => {
    const text = goalText(value);
    return `<div class="slot${done ? " done" : ""}">
      <span class="glabel">${label}</span>
      <span class="gtext${text ? "" : " tbc"}">${text ? esc(text) : t.tbc}</span>
      <span class="tick" role="img" aria-label="${done ? t.done : t.notDone}">${done ? "✓" : ""}</span>
    </div>`;
  };
  document.getElementById("goals-list").innerHTML = DATA.personalGoals.map(week => `
    <div class="gweek${week.week === w.number ? " cur" : ""}">
      <h3>${esc(t.goalWeek(week))}</h3>
      <div class="goals">
        ${week.people.map(p => `
          <div class="gcard"><h3>${esc(p.name)}</h3>
            ${goalSlot(t.goal1, p.goal1, !!p.goal1Done)}
            ${goalSlot(t.goal2, p.goal2, !!p.goal2Done)}
          </div>`).join("")}
      </div>
    </div>`).join("");
  document.getElementById("tl-list").innerHTML = DATA.timeline.map(x => `
    <li class="${x.week === "W" + w.number ? "cur" : ""}"><b>${x.week}</b>${x.dates ? esc(x.dates[LANG]) + (x.trial ? (LANG === "zh" ? `（${t.trial}）` : ` (${t.trial})`) : "") : `<span class="tbc">${t.datesTbc}</span>`}</li>`).join("");
}
function setLang(l){ LANG = l; try{ localStorage.setItem("lb-lang", l); }catch(e){} render(); }
try{ const s = localStorage.getItem("lb-lang"); if (s === "en" || s === "zh") LANG = s; }catch(e){}
render();
</script>
</body>
</html>
